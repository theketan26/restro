[package]
name = "tauri-next-app"
version = "0.1.0"
description = "MyApp — Tauri + Next.js desktop client"
authors = []
license = ""
repository = ""
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
mdns-sd = "0.7"
ipnetwork = "0.20"
hostname = "0.4"
chrono = { version = "0.4", features = ["serde", "clock"] }
jsonwebtoken = "8"
base64 = "0.22"
